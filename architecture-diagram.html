<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sipra — Architecture Diagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }
  .arch-diagram {
    width: 1200px;
    background: #0d1117;
    border: 1px solid #1e293b;
    border-radius: 12px;
    overflow: hidden;
    padding: 36px 40px;
    box-shadow: 0 0 60px rgba(59,130,246,0.08);
  }
  .arch-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3b82f6;
    text-align: center;
    margin-bottom: 32px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div class="arch-diagram">
    <div class="arch-title">Sipra — Autonomous AI Orchestrator for Bio-Logistics · Architecture</div>

    <svg width="100%" viewBox="0 0 1100 430" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0,1 L0,7 L7,4 z" fill="#3b82f6"/>
        </marker>
        <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0,1 L0,7 L7,4 z" fill="#4ade80"/>
        </marker>
        <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0,1 L0,7 L7,4 z" fill="#fbbf24"/>
        </marker>
        <marker id="arrRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0,1 L0,7 L7,4 z" fill="#f87171"/>
        </marker>
        <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0,1 L0,7 L7,4 z" fill="#a78bfa"/>
        </marker>
        <filter id="glow-blue">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-green">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ── Ambulance (source) ── -->
      <g transform="translate(60,180)">
        <rect x="-44" y="-30" width="88" height="60" rx="8" fill="#0c1f3f" stroke="#2563eb" stroke-width="1.5"/>
        <text x="0" y="-8" text-anchor="middle" font-size="20">🚑</text>
        <text x="0" y="12" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="600">Ambulance</text>
        <text x="0" y="22" text-anchor="middle" font-size="8" fill="#475569">GPS pings</text>
      </g>

      <!-- ── Arrow: Ambulance → Core ── -->
      <line x1="104" y1="180" x2="188" y2="180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" filter="url(#glow-blue)"/>
      <text x="146" y="172" text-anchor="middle" font-size="8" fill="#3b82f6">POST /pings</text>
      <text x="146" y="195" text-anchor="middle" font-size="7" fill="#334155">202 async</text>

      <!-- ── Core Go/Fiber (center-left) ── -->
      <g transform="translate(295,180)">
        <rect x="-100" y="-95" width="200" height="190" rx="10" fill="#0d1117" stroke="#1e40af" stroke-width="2"/>
        <rect x="-88" y="-83" width="176" height="36" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="-68" text-anchor="middle" font-size="8" fill="#60a5fa" font-weight="700" letter-spacing="1">FIBER HTTP API</text>
        <text x="0" y="-57" text-anchor="middle" font-size="7" fill="#475569">ingest · trips · bounties</text>

        <rect x="-88" y="-40" width="176" height="30" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="-30" text-anchor="middle" font-size="8" fill="#4ade80" font-weight="700" letter-spacing="1">REDIS CACHE</text>
        <text x="0" y="-19" text-anchor="middle" font-size="7" fill="#475569">hot path · Lua drain</text>

        <rect x="-88" y="-3" width="176" height="30" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="7" text-anchor="middle" font-size="8" fill="#a78bfa" font-weight="700" letter-spacing="1">POSTGRES / POSTGIS</text>
        <text x="0" y="18" text-anchor="middle" font-size="7" fill="#475569">batch flush · ST_Buffer</text>

        <rect x="-88" y="34" width="80" height="28" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="-48" y="48" text-anchor="middle" font-size="7" fill="#f59e0b" font-weight="700">CORRIDOR</text>
        <text x="-48" y="58" text-anchor="middle" font-size="7" fill="#475569">engine</text>

        <rect x="-2" y="34" width="90" height="28" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="43" y="48" text-anchor="middle" font-size="7" fill="#f87171" font-weight="700">RISK</text>
        <text x="43" y="58" text-anchor="middle" font-size="7" fill="#475569">monitor</text>

        <rect x="-88" y="68" width="80" height="28" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="-48" y="82" text-anchor="middle" font-size="7" fill="#3b82f6" font-weight="700">WS HUB</text>
        <text x="-48" y="92" text-anchor="middle" font-size="7" fill="#475569">broadcast</text>

        <rect x="-2" y="68" width="90" height="28" rx="5" fill="#111827" stroke="#1e293b"/>
        <text x="43" y="82" text-anchor="middle" font-size="7" fill="#10b981" font-weight="700">WEBHOOKS</text>
        <text x="43" y="92" text-anchor="middle" font-size="7" fill="#475569">worker pool</text>

        <text x="0" y="-100" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="800" letter-spacing="2">Go / Fiber Core · :8080</text>
      </g>

      <!-- ── Arrow: Core → AI Brain ── -->
      <line x1="295" y1="85" x2="295" y2="30" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrRed)"/>
      <line x1="295" y1="30" x2="530" y2="30" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrRed)"/>
      <text x="430" y="22" text-anchor="middle" font-size="8" fill="#f87171">poll /predict every 10s</text>

      <!-- ── AI Brain ── -->
      <g transform="translate(610,30)">
        <rect x="-68" y="-22" width="136" height="56" rx="8" fill="#1a0a1f" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="0" y="-5" text-anchor="middle" font-size="9" fill="#c084fc" font-weight="700">AI BRAIN</text>
        <text x="0" y="8" text-anchor="middle" font-size="8" fill="#7c3aed">FastAPI · :8000</text>
        <text x="0" y="20" text-anchor="middle" font-size="7" fill="#475569">haversine · breach predict</text>
        <text x="0" y="-22" text-anchor="middle" font-size="7" fill="#6d28d9">Python 3.11</text>
      </g>

      <!-- Return arrow: AI Brain → Core (breach=true) -->
      <line x1="610" y1="64" x2="610" y2="90" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 3"/>
      <line x1="610" y1="90" x2="395" y2="90" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrPurple)"/>
      <text x="510" y="84" text-anchor="middle" font-size="8" fill="#a78bfa">will_breach=true → DroneHandoff</text>

      <!-- ── Arrow: Core → Next.js (WS) ── -->
      <line x1="395" y1="145" x2="680" y2="145" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)" filter="url(#glow-blue)"/>
      <text x="537" y="137" text-anchor="middle" font-size="8" fill="#3b82f6">WebSocket /ws/dashboard</text>
      <text x="537" y="160" text-anchor="middle" font-size="7" fill="#334155">GPS_UPDATE · CORRIDOR_UPDATE · HANDOFF_INITIATED</text>

      <!-- ── Next.js Dashboard ── -->
      <g transform="translate(780,180)">
        <rect x="-88" y="-80" width="176" height="160" rx="10" fill="#0d1117" stroke="#0ea5e9" stroke-width="1.5"/>
        <text x="0" y="-88" text-anchor="middle" font-size="9" fill="#38bdf8" font-weight="800" letter-spacing="2">Next.js Dashboard · :3000</text>
        <text x="0" y="-62" text-anchor="middle" font-size="8" fill="#0ea5e9" font-weight="600">CorridorMap</text>
        <text x="0" y="-50" text-anchor="middle" font-size="7" fill="#475569">Deck.gl 9 + Google Maps</text>
        <rect x="-76" y="-44" width="152" height="16" rx="3" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="-32" text-anchor="middle" font-size="7" fill="#60a5fa">ExclusionPolygon  (pulsing)</text>

        <rect x="-76" y="-22" width="152" height="16" rx="3" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="-10" text-anchor="middle" font-size="7" fill="#fbbf24">FleetSwarm (50 vehicles)</text>

        <rect x="-76" y="0" width="152" height="16" rx="3" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="12" text-anchor="middle" font-size="7" fill="#a78bfa">HandoffBanner (slide-in)</text>

        <rect x="-76" y="22" width="152" height="16" rx="3" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="34" text-anchor="middle" font-size="7" fill="#4ade80">AIBrainPanel · BountyPanel</text>

        <rect x="-76" y="44" width="152" height="16" rx="3" fill="#111827" stroke="#1e293b"/>
        <text x="0" y="56" text-anchor="middle" font-size="7" fill="#f59e0b">RerouteStatusPanel</text>

        <rect x="-76" y="66" width="152" height="16" rx="3" fill="#0a1929" stroke="#1e40af"/>
        <text x="0" y="78" text-anchor="middle" font-size="7" fill="#3b82f6">useSipraWebSocket · auto-reconnect</text>
      </g>

      <!-- ── Arrow: Core → Fleet (webhook) ── -->
      <line x1="395" y1="230" x2="670" y2="330" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#glow-green)"/>
      <text x="540" y="300" text-anchor="middle" font-size="8" fill="#4ade80" transform="rotate(-27,540,300)">webhook · exclusion-zone</text>

      <!-- ── Fleet Receiver ── -->
      <g transform="translate(750,370)">
        <rect x="-68" y="-22" width="136" height="48" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
        <text x="0" y="-6" text-anchor="middle" font-size="8" fill="#4ade80" font-weight="700">Fleet Receiver</text>
        <text x="0" y="6" text-anchor="middle" font-size="7" fill="#166534">Express · :4000</text>
        <text x="0" y="18" text-anchor="middle" font-size="7" fill="#475569">Uber · Swiggy · Ola · Dunzo</text>
      </g>

      <!-- ── Arrow: Core → Drone Dispatch ── -->
      <line x1="395" y1="260" x2="670" y2="400" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrPurple)"/>

      <!-- ── Drone Dispatch ── -->
      <g transform="translate(750,430)">
        <rect x="-68" y="-22" width="136" height="48" rx="8" fill="#1a0a1f" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 3"/>
        <text x="0" y="-6" text-anchor="middle" font-size="8" fill="#a78bfa" font-weight="700">Drone Dispatch</text>
        <text x="0" y="6" text-anchor="middle" font-size="7" fill="#4c1d95">Express · :4003</text>
        <text x="0" y="18" text-anchor="middle" font-size="7" fill="#475569">mock · POST /dispatch</text>
      </g>

      <!-- ── Simulator ── -->
      <g transform="translate(60,380)">
        <rect x="-44" y="-22" width="88" height="48" rx="8" fill="#1a1a0a" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 3"/>
        <text x="0" y="-6" text-anchor="middle" font-size="8" fill="#fbbf24" font-weight="700">GPS Simulator</text>
        <text x="0" y="6" text-anchor="middle" font-size="7" fill="#78716c">50 fleet + ambulance</text>
        <text x="0" y="18" text-anchor="middle" font-size="7" fill="#475569">simulate-gps.ts</text>
      </g>

      <!-- Arrow simulator to Core -->
      <line x1="104" y1="380" x2="220" y2="300" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>

      <!-- Legend box -->
      <g transform="translate(960, 10)">
        <rect x="0" y="0" width="130" height="110" rx="6" fill="#0d1117" stroke="#1e293b"/>
        <text x="65" y="16" text-anchor="middle" font-size="8" fill="#475569" font-weight="700" letter-spacing="1">ARROW TYPES</text>
        <line x1="10" y1="28" x2="40" y2="28" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
        <text x="48" y="32" font-size="8" fill="#94a3b8">Real-time</text>
        <line x1="10" y1="46" x2="40" y2="46" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)"/>
        <text x="48" y="50" font-size="8" fill="#94a3b8">AI polling</text>
        <line x1="10" y1="64" x2="40" y2="64" stroke="#4ade80" stroke-width="2" marker-end="url(#arrGreen)"/>
        <text x="48" y="68" font-size="8" fill="#94a3b8">Webhook</text>
        <line x1="10" y1="82" x2="40" y2="82" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrPurple)"/>
        <text x="48" y="86" font-size="8" fill="#94a3b8">Drone path</text>
        <line x1="10" y1="100" x2="40" y2="100" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
        <text x="48" y="104" font-size="8" fill="#94a3b8">Simulation</text>
      </g>

      <!-- Tech stack pills -->
      <g transform="translate(240,415)">
        <rect x="0" y="0" width="420" height="22" rx="5" fill="#0d1117" stroke="#1e293b"/>
        <text x="10" y="15" font-size="8" fill="#64748b">STACK:</text>
        <rect x="50" y="4" width="50" height="14" rx="3" fill="#1e293b"/>
        <text x="75" y="15" text-anchor="middle" font-size="8" fill="#60a5fa">Go 1.26</text>
        <rect x="108" y="4" width="60" height="14" rx="3" fill="#1e293b"/>
        <text x="138" y="15" text-anchor="middle" font-size="8" fill="#f97316">Next.js 14</text>
        <rect x="176" y="4" width="62" height="14" rx="3" fill="#1e293b"/>
        <text x="207" y="15" text-anchor="middle" font-size="8" fill="#c084fc">FastAPI</text>
        <rect x="246" y="4" width="60" height="14" rx="3" fill="#1e293b"/>
        <text x="276" y="15" text-anchor="middle" font-size="8" fill="#4ade80">PostGIS</text>
        <rect x="314" y="4" width="40" height="14" rx="3" fill="#1e293b"/>
        <text x="334" y="15" text-anchor="middle" font-size="8" fill="#f87171">Redis</text>
        <rect x="362" y="4" width="50" height="14" rx="3" fill="#1e293b"/>
        <text x="387" y="15" text-anchor="middle" font-size="8" fill="#38bdf8">Deck.gl</text>
      </g>
    </svg>
  </div>
</body>
</html>
