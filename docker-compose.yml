services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sipra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sipra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sipra}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./services/core-go/internal/store/postgres/migrations/001_init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/docker/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sipra} -d ${POSTGRES_DB:-sipra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sipra-net

  redis:
    image: redis:7-alpine
    container_name: sipra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sipra-net

  core-go:
    build:
      context: ./services/core-go
      dockerfile: Dockerfile
    container_name: sipra-core-go
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://sipra:sipra_dev@postgres:5432/sipra?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      AI_BRAIN_URL: http://ai-brain:8000
      MOCK_DRONE_URL: http://drone-dispatch:4003
      VALHALLA_URL: http://valhalla:8002
      CHAOS_ENABLED: "false"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    networks:
      - sipra-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: sipra-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      # Single-node KRaft mode — no Zookeeper. INTERNAL is for other
      # containers (advertised as the `kafka` service hostname); EXTERNAL is
      # for core-go running on the host via `go run` against this compose
      # stack (advertised as localhost, mapped to host port 9094).
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Auto-create is off on purpose: letting a lazy produce trigger topic
      # creation races the webhook consumer group's first JoinGroup against
      # not-yet-propagated partition metadata, which can wedge the rebalance
      # at zero assigned partitions forever (observed firsthand — restart was
      # the only recovery). kafka-topic-init below provisions the topic
      # deterministically before core-go ever connects.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single-broker cluster: the internal __consumer_offsets topic defaults
      # to replication factor 3, which can never satisfy with 1 broker — every
      # consumer group's FindCoordinator request hangs with "Group Coordinator
      # Not Available" until this is dropped to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "sipra-kafka-kraft-cluster-1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 25s
    networks:
      - sipra-net

  kafka-topic-init:
    image: apache/kafka:3.9.0
    container_name: sipra-kafka-topic-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - sipra.webhook.deliveries
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    networks:
      - sipra-net

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      target: dev
    container_name: sipra-web
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://core-go:8080
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      NEXT_PUBLIC_BACKEND_WS_URL: ws://localhost:8080/ws/dashboard
      NEXT_PUBLIC_BACKEND_HTTP_URL: http://localhost:8080
      NEXT_PUBLIC_SIM_WS_URL: ws://localhost:4001
      NEXT_PUBLIC_CHAOS_ENABLED: "false"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./services/web:/app
      - /app/node_modules
      - /app/.next
      - ./datasets:/app/datasets:ro
    depends_on:
      - core-go
    networks:
      - sipra-net

  ai-brain:
    build:
      context: ./services/ai-brain
      dockerfile: Dockerfile
    container_name: sipra-ai-brain
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Demo profile: ai-brain is reachable only on the docker network, never
      # exposed to the public internet, so HMAC/JWT/api-key auth is overkill
      # for hackathon runs. Re-enable for any non-demo deployment.
      AI_AUTH_REQUIRED: "false"
      DATABASE_URL: postgres://sipra:sipra_dev@postgres:5432/sipra?sslmode=disable
      # Google Routes API v2 — TRAFFIC_AWARE_OPTIMAL ETA backbone.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      # Live weather lookup at the ambulance position (FHWA-mapped multipliers).
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sipra-net

  fleet-receiver:
    build:
      context: ./services/mocks/fleet-receiver
      dockerfile: Dockerfile
    container_name: sipra-fleet-receiver
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - sipra-net

  drone-dispatch:
    build:
      context: ./services/mocks/drone-dispatch
      dockerfile: Dockerfile
    container_name: sipra-drone-dispatch
    restart: unless-stopped
    ports:
      - "4003:4003"
    networks:
      - sipra-net

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: sipra-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: "https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf"
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "False"
      use_default_speeds_config: "True"
      force_rebuild: "False"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/status >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - sipra-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  sipra-net:
    driver: bridge
